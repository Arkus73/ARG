<body>

    <p id="monologue"></p>

    <a id="continue" style="display:none" href="email.html">continue</a>

    <script src="script.js"></script>
    <script>

        const monologue = document.getElementById("monologue");
        const monologueText = "'She said my name'? What a strange hidden message. I wonder what that means, or why he didn't write it normally in his letter.\n\
        *RING, RING* Hmm, is that my phone? I wonder who's calling so late...";
        const phoneCall = document.getElementById("phoneCall");
        const contin = document.getElementById("continue");

        document.addEventListener("click", () => {
            writeText(monologue, monologueText, () => {
                phoneCall.style.display = "";
                contin.style.display = "";
            });
        }, { once: true });

    </script>
